<!DOCTYPE html>
<html lang="zh-Hant">

<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>MJ Anatomy 3D — Skeleton Inspector</title>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #08090b;
  color: white;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}

canvas {
  display: block;
  width: 100%;
  height: 100%;
  touch-action: none;
}


/* ===========================
   LEFT PANEL
=========================== */

#panel {
  position: fixed;

  top: 18px;
  left: 18px;

  z-index: 20;

  width: 280px;

  padding: 18px;

  background:
    rgba(17,19,23,.93);

  border:
    1px solid
    rgba(255,255,255,.12);

  border-radius: 18px;

  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
}

#panel h1 {
  margin: 0;
  font-size: 21px;
}

#subtitle {
  margin-top: 5px;

  color: #969da7;

  font-size: 13px;
}

#status {
  margin-top: 12px;

  color: #f0c36a;

  font-size: 12px;
}

.divider {
  height: 1px;

  margin: 16px 0;

  background:
    rgba(255,255,255,.10);
}

.section-title {
  margin-bottom: 10px;

  color: #aeb5bf;

  font-size: 11px;

  font-weight: 700;

  letter-spacing: 1px;
}


/* ===========================
   BUTTON
=========================== */

.main-button {
  width: 100%;

  padding: 12px;

  margin-bottom: 8px;

  border:
    1px solid
    rgba(255,255,255,.14);

  border-radius: 11px;

  background: #26384c;

  color: #d9eaff;

  font-size: 13px;

  font-weight: 600;

  cursor: pointer;
}

#info {
  margin-top: 10px;

  color: #8e969f;

  font-size: 11px;

  line-height: 1.5;
}


/* ===========================
   INSPECTOR
=========================== */

#inspector {
  position: fixed;

  top: 18px;
  right: 18px;

  z-index: 30;

  display: none;

  flex-direction: column;

  width: 410px;

  height:
    calc(100vh - 36px);

  background:
    rgba(14,16,19,.98);

  border:
    1px solid
    rgba(255,255,255,.14);

  border-radius: 18px;

  overflow: hidden;

  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
}

#inspectorHeader {
  padding: 16px;

  border-bottom:
    1px solid
    rgba(255,255,255,.10);
}

#inspectorTitle {
  font-size: 17px;

  font-weight: 700;
}

#inspectorSubtitle {
  margin-top: 4px;

  color: #8e969f;

  font-size: 11px;
}

#controls {
  display: flex;

  gap: 8px;

  margin-top: 12px;
}

.inspector-button {
  flex: 1;

  padding: 10px;

  border:
    1px solid
    rgba(255,255,255,.12);

  border-radius: 9px;

  background: #25282e;

  color: white;

  font-size: 12px;
}

#copyButton {
  background: #26384c;

  color: #d9eaff;
}

#closeButton {
  background: #3b2527;

  color: #ffb8b8;
}


/* ===========================
   SEARCH
=========================== */

#search {
  width:
    calc(100% - 30px);

  margin:
    12px 15px 4px;

  padding: 10px;

  border:
    1px solid
    rgba(255,255,255,.12);

  border-radius: 9px;

  outline: none;

  background: #202329;

  color: white;

  font-size: 13px;
}

#objectCount {
  padding:
    7px 15px;

  color: #89919b;

  font-size: 11px;
}


/* ===========================
   OBJECT LIST
=========================== */

#objectList {
  flex: 1;

  overflow-y: auto;

  padding:
    0 12px 15px;
}

.object-item {
  padding:
    9px 10px;

  margin-bottom: 5px;

  background: #202329;

  border-radius: 8px;

  color: #d8dce1;

  font-family:
    ui-monospace,
    SFMono-Regular,
    Menlo,
    monospace;

  font-size: 11px;

  word-break: break-word;
}

.object-parent {
  display: block;

  margin-top: 3px;

  color: #737c87;

  font-size: 10px;
}


/* ===========================
   HELP
=========================== */

#help {
  position: fixed;

  left: 50%;
  bottom: 18px;

  transform:
    translateX(-50%);

  z-index: 15;

  padding:
    9px 15px;

  background:
    rgba(18,20,23,.86);

  border:
    1px solid
    rgba(255,255,255,.12);

  border-radius: 20px;

  color: #a5abb2;

  font-size: 12px;

  white-space: nowrap;
}


/* ===========================
   IPAD
=========================== */

@media (max-width: 900px) {

  #panel {
    width: 245px;
  }

  #inspector {
    width: 370px;
  }

}

</style>


<script type="importmap">

{
  "imports": {

    "three":
    "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",

    "three/addons/":
    "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"

  }
}

</script>

</head>


<body>


<!-- ===========================
     LEFT PANEL
=========================== -->

<div id="panel">

  <h1>
    MJ Anatomy 3D
  </h1>

  <div id="subtitle">
    Skeleton Structure Inspector
  </div>

  <div id="status">
    ● Loading skeleton...
  </div>


  <div class="divider"></div>


  <div class="section-title">
    JOINT DEVELOPMENT
  </div>


  <button
    id="inspectButton"
    class="main-button"
  >
    Inspect Skeleton Model
  </button>


  <div id="info">

    今次會讀取 skeleton.glb
    入面所有骨骼 Mesh / Object3D。

    <br><br>

    完成後撳 Copy All，
    將結果貼返俾我。

  </div>

</div>



<!-- ===========================
     INSPECTOR
=========================== -->

<div id="inspector">


  <div id="inspectorHeader">

    <div id="inspectorTitle">
      Skeleton Model Inspector
    </div>


    <div id="inspectorSubtitle">
      skeleton.glb — hierarchy / bone names
    </div>


    <div id="controls">

      <button
        id="copyButton"
        class="inspector-button"
      >
        Copy All
      </button>


      <button
        id="closeButton"
        class="inspector-button"
      >
        Close
      </button>

    </div>

  </div>


  <input
    id="search"
    type="text"
    placeholder="Search: humerus, radius, ulna..."
  >


  <div id="objectCount">
    Waiting for skeleton...
  </div>


  <div id="objectList"></div>


</div>



<div id="help">
  單指旋轉 · 雙指縮放 / 移動
</div>



<script type="module">


/* =========================================
   IMPORTS
========================================= */

import * as THREE
from "three";


import {
  OrbitControls
}
from
"three/addons/controls/OrbitControls.js";


import {
  GLTFLoader
}
from
"three/addons/loaders/GLTFLoader.js";


import {
  DRACOLoader
}
from
"three/addons/loaders/DRACOLoader.js";



/* =========================================
   UI
========================================= */

const status =
  document.getElementById(
    "status"
  );


const inspector =
  document.getElementById(
    "inspector"
  );


const objectList =
  document.getElementById(
    "objectList"
  );


const objectCount =
  document.getElementById(
    "objectCount"
  );


const search =
  document.getElementById(
    "search"
  );



/* =========================================
   SCENE
========================================= */

const scene =
  new THREE.Scene();


scene.background =
  new THREE.Color(
    0x08090b
  );



/* =========================================
   CAMERA
========================================= */

const camera =
  new THREE.PerspectiveCamera(

    35,

    window.innerWidth /
    window.innerHeight,

    0.01,

    10000

  );


camera.position.set(
  0,
  0,
  5
);



/* =========================================
   RENDERER
========================================= */

const renderer =
  new THREE.WebGLRenderer({

    antialias: true,

    powerPreference:
      "high-performance"

  });


renderer.setSize(

  window.innerWidth,

  window.innerHeight

);


renderer.setPixelRatio(

  Math.min(

    window.devicePixelRatio,

    1.75

  )

);


renderer.outputColorSpace =
  THREE.SRGBColorSpace;


renderer.toneMapping =
  THREE.ACESFilmicToneMapping;


renderer.toneMappingExposure =
  0.72;


document.body.appendChild(
  renderer.domElement
);



/* =========================================
   LIGHTING
========================================= */

scene.add(

  new THREE.HemisphereLight(

    0xffffff,

    0x25282d,

    1.15

  )

);



const keyLight =
  new THREE.DirectionalLight(

    0xfff6e8,

    1.8

  );


keyLight.position.set(
  4,
  6,
  7
);


scene.add(
  keyLight
);



const fillLight =
  new THREE.DirectionalLight(

    0xcbdcff,

    0.65

  );


fillLight.position.set(
  -5,
  2,
  4
);


scene.add(
  fillLight
);



const rimLight =
  new THREE.DirectionalLight(

    0xffffff,

    0.5

  );


rimLight.position.set(
  0,
  3,
  -5
);


scene.add(
  rimLight
);



/* =========================================
   CONTROLS
========================================= */

const controls =
  new OrbitControls(

    camera,

    renderer.domElement

  );


controls.enableDamping =
  true;


controls.dampingFactor =
  0.06;


controls.enableRotate =
  true;


controls.enableZoom =
  true;


controls.enablePan =
  true;



/* =========================================
   DRACO
========================================= */

const dracoLoader =
  new DRACOLoader();


dracoLoader.setDecoderPath(

  "https://www.gstatic.com/draco/v1/decoders/"

);



/* =========================================
   GLTF
========================================= */

const loader =
  new GLTFLoader();


loader.setDRACOLoader(
  dracoLoader
);



/* =========================================
   SKELETON ROOT
========================================= */

const human =
  new THREE.Group();


scene.add(
  human
);


let skeleton =
  null;


let skeletonObjects =
  [];



/* =========================================
   COLLECT SKELETON OBJECTS
========================================= */

function collectSkeletonObjects(
  model
) {


  skeletonObjects =
    [];


  model.traverse(

    function (
      object
    ) {


      if (
        object === model
      ) {

        return;

      }


      const name =

        object.name &&
        object.name.trim() !== ""

        ?

        object.name

        :

        "(unnamed)";


      const parentName =

        object.parent &&
        object.parent.name

        ?

        object.parent.name

        :

        "(none)";


      skeletonObjects.push({

        name:
          name,

        type:
          object.type ||
          "Object3D",

        parent:
          parentName,

        childCount:
          object.children.length,

        isMesh:
          object.isMesh === true

      });

    }

  );


  console.log(

    "Skeleton objects:",

    skeletonObjects

  );

}



/* =========================================
   LOAD SKELETON
========================================= */

loader.load(


  "./models/skeleton.glb",


  function (
    gltf
  ) {


    skeleton =
      gltf.scene;


    skeleton.name =
      "skeleton";


    skeleton.traverse(

      function (
        object
      ) {


        if (
          object.isMesh
        ) {


          if (
            object.material
          ) {


            object.material.side =
              THREE.FrontSide;


            object.material.needsUpdate =
              true;

          }

        }

      }

    );


    human.add(
      skeleton
    );


    collectSkeletonObjects(
      skeleton
    );


    centreSkeleton();


    status.textContent =
      "● Skeleton loaded";


    status.style.color =
      "#7ee787";

  },


  undefined,


  function (
    error
  ) {


    console.error(
      error
    );


    status.textContent =
      "● Skeleton loading error";


    status.style.color =
      "#ff6b6b";

  }


);



/* =========================================
   CENTRE / FIT
========================================= */

function centreSkeleton() {


  const box =
    new THREE.Box3()
      .setFromObject(
        skeleton
      );


  const center =
    new THREE.Vector3();


  const size =
    new THREE.Vector3();


  box.getCenter(
    center
  );


  box.getSize(
    size
  );


  human.position.sub(
    center
  );


  fitCamera(
    size
  );

}



/* =========================================
   CAMERA FIT
========================================= */

function fitCamera(
  size
) {


  const vFov =

    THREE.MathUtils
      .degToRad(
        camera.fov
      );


  const heightDistance =

    size.y /

    (
      2 *

      Math.tan(
        vFov / 2
      )
    );



  const hFov =

    2 *

    Math.atan(

      Math.tan(
        vFov / 2
      )

      *

      camera.aspect

    );



  const widthDistance =

    size.x /

    (
      2 *

      Math.tan(
        hFov / 2
      )
    );



  let distance =

    Math.max(

      heightDistance,

      widthDistance

    );


  distance *=
    1.15;



  camera.position.set(

    0,

    0,

    distance

  );


  const maxSize =

    Math.max(

      size.x,

      size.y,

      size.z

    );


  camera.near =

    Math.max(

      maxSize / 1000,

      0.001

    );


  camera.far =

    maxSize *
    100;


  camera.updateProjectionMatrix();



  controls.target.set(
    0,
    0,
    0
  );


  controls.minDistance =
    distance *
    0.08;


  controls.maxDistance =
    distance *
    6;


  controls.update();

}



/* =========================================
   RENDER INSPECTOR
========================================= */

function renderInspector(
  filter = ""
) {


  objectList.innerHTML =
    "";


  const q =
    filter
      .trim()
      .toLowerCase();


  const filtered =

    skeletonObjects.filter(

      function (
        item
      ) {


        if (
          q === ""
        ) {

          return true;

        }


        return (

          item.name
            .toLowerCase()
            .includes(
              q
            )

          ||

          item.parent
            .toLowerCase()
            .includes(
              q
            )

          ||

          item.type
            .toLowerCase()
            .includes(
              q
            )

        );

      }

    );


  objectCount.textContent =

    filtered.length +

    " shown / " +

    skeletonObjects.length +

    " total objects";



  filtered.forEach(

    function (
      item,
      index
    ) {


      const div =
        document.createElement(
          "div"
        );


      div.className =
        "object-item";


      const title =
        document.createElement(
          "div"
        );


      title.textContent =

        (index + 1) +

        ". [" +

        item.type +

        "] " +

        item.name;



      const parent =
        document.createElement(
          "span"
        );


      parent.className =
        "object-parent";


      parent.textContent =

        "parent: " +

        item.parent +

        " · children: " +

        item.childCount;



      div.appendChild(
        title
      );


      div.appendChild(
        parent
      );


      objectList.appendChild(
        div
      );

    }

  );

}



/* =========================================
   OPEN INSPECTOR
========================================= */

document
  .getElementById(
    "inspectButton"
  )
  .addEventListener(

    "click",

    function () {


      inspector.style.display =
        "flex";


      renderInspector(
        search.value
      );

    }

  );



/* =========================================
   CLOSE
========================================= */

document
  .getElementById(
    "closeButton"
  )
  .addEventListener(

    "click",

    function () {


      inspector.style.display =
        "none";

    }

  );



/* =========================================
   SEARCH
========================================= */

search.addEventListener(

  "input",

  function () {


    renderInspector(
      search.value
    );

  }

);



/* =========================================
   COPY ALL
========================================= */

document
  .getElementById(
    "copyButton"
  )
  .addEventListener(

    "click",

    async function () {


      const button =
        this;


      const text =

        skeletonObjects
          .map(

            function (
              item,
              index
            ) {


              return (

                (index + 1) +

                ". [" +

                item.type +

                "] " +

                item.name +

                " | parent: " +

                item.parent +

                " | children: " +

                item.childCount

              );

            }

          )
          .join(
            "\n"
          );


      try {


        await navigator
          .clipboard
          .writeText(
            text
          );


        button.textContent =
          "Copied ✓";


        setTimeout(

          function () {


            button.textContent =
              "Copy All";

          },

          1500

        );


      }

      catch (
        error
      ) {


        console.error(
          error
        );


        /*
          iPad fallback:
          put all text directly on screen
          so it can still be selected/copied.
        */


        objectList.innerHTML =
          "";


        const textarea =
          document.createElement(
            "textarea"
          );


        textarea.value =
          text;


        textarea.style.width =
          "100%";


        textarea.style.height =
          "100%";


        textarea.style.background =
          "#17191d";


        textarea.style.color =
          "white";


        textarea.style.border =
          "none";


        textarea.style.padding =
          "12px";


        textarea.style.fontSize =
          "11px";


        objectList.appendChild(
          textarea
        );


        textarea.focus();


        textarea.select();


        button.textContent =
          "Select text below";

      }

    }

  );



/* =========================================
   RESIZE
========================================= */

window.addEventListener(

  "resize",

  function () {


    camera.aspect =

      window.innerWidth /

      window.innerHeight;


    camera.updateProjectionMatrix();


    renderer.setSize(

      window.innerWidth,

      window.innerHeight

    );

  }

);



/* =========================================
   ANIMATION
========================================= */

function animate() {


  requestAnimationFrame(
    animate
  );


  controls.update();


  renderer.render(

    scene,

    camera

  );

}


animate();


</script>

</body>
</html>
