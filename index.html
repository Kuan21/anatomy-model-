<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>MJ Anatomy 3D</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;

      background: #08090b;
      color: white;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }


    /* =========================
       MAIN PANEL
    ========================= */

    #panel {
      position: fixed;

      top: 20px;
      left: 20px;

      z-index: 20;

      width: 285px;
      max-height: calc(100vh - 40px);

      overflow-y: auto;

      padding: 18px;

      background: rgba(17, 19, 23, 0.90);

      border:
        1px solid rgba(255,255,255,0.12);

      border-radius: 18px;

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      box-shadow:
        0 12px 40px rgba(0,0,0,0.35);
    }


    #panel h1 {
      margin: 0;

      font-size: 21px;
      font-weight: 700;
    }


    #subtitle {
      margin-top: 5px;

      color: #969da7;

      font-size: 13px;
    }


    #status {
      margin-top: 12px;

      color: #f0c36a;

      font-size: 12px;
    }


    .divider {
      height: 1px;

      margin: 16px 0;

      background:
        rgba(255,255,255,0.10);
    }


    .section-title {
      margin-bottom: 10px;

      color: #aeb5bf;

      font-size: 11px;
      font-weight: 700;

      letter-spacing: 1px;

      text-transform: uppercase;
    }


    /* =========================
       LAYER BUTTONS
    ========================= */

    .layer {
      display: flex;

      align-items: center;

      width: 100%;

      margin-bottom: 7px;

      padding: 11px 12px;

      border:
        1px solid rgba(255,255,255,0.10);

      border-radius: 11px;

      background: #202329;

      color: white;

      font-size: 14px;

      cursor: pointer;

      -webkit-tap-highlight-color:
        transparent;
    }


    .layer.active {
      background: #303741;

      border-color:
        rgba(255,255,255,0.25);
    }


    .dot {
      width: 10px;
      height: 10px;

      margin-right: 10px;

      border-radius: 50%;
    }


    .bone-dot {
      background: #e8dfca;
    }

    .muscle-dot {
      background: #c95d5d;
    }

    .nerve-dot {
      background: #e6c94c;
    }

    .cardio-dot {
      background: #c84f58;
    }

    .viscera-dot {
      background: #b98678;
    }


    .layer-state {
      margin-left: auto;

      color: #8f97a1;

      font-size: 11px;
    }


    /* =========================
       INFO
    ========================= */

    #info {
      color: #8e959e;

      font-size: 12px;

      line-height: 1.5;
    }


    /* =========================
       HELP
    ========================= */

    #help {
      position: fixed;

      left: 50%;
      bottom: 20px;

      z-index: 15;

      transform:
        translateX(-50%);

      padding: 9px 15px;

      background:
        rgba(18,20,23,.86);

      border:
        1px solid rgba(255,255,255,.12);

      border-radius: 20px;

      color: #a5abb2;

      font-size: 12px;

      white-space: nowrap;
    }


    @media (max-width: 700px) {

      #panel {
        top: 12px;
        left: 12px;

        width: 245px;

        padding: 14px;
      }

      #panel h1 {
        font-size: 18px;
      }

      .layer {
        padding: 9px 10px;
      }

    }

  </style>


  <!-- =========================
       THREE.JS IMPORT MAP
  ========================== -->

  <script type="importmap">

  {
    "imports": {

      "three":
      "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",

      "three/addons/":
      "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"

    }
  }

  </script>

</head>



<body>


  <!-- =========================
       CONTROL PANEL
  ========================== -->

  <div id="panel">

    <h1>
      MJ Anatomy 3D
    </h1>

    <div id="subtitle">
      Interactive Human Anatomy
    </div>

    <div id="status">
      ● Loading anatomy...
    </div>


    <div class="divider"></div>


    <div class="section-title">
      Anatomy Layers
    </div>


    <button
      class="layer active"
      data-layer="skeleton"
    >

      <span class="dot bone-dot"></span>

      Skeleton

      <span class="layer-state">
        ON
      </span>

    </button>


    <button
      class="layer"
      data-layer="muscular"
    >

      <span class="dot muscle-dot"></span>

      Muscles

      <span class="layer-state">
        OFF
      </span>

    </button>


    <button
      class="layer"
      data-layer="nervous"
    >

      <span class="dot nerve-dot"></span>

      Nervous System

      <span class="layer-state">
        OFF
      </span>

    </button>


    <button
      class="layer"
      data-layer="cardiovascular"
    >

      <span class="dot cardio-dot"></span>

      Cardiovascular

      <span class="layer-state">
        OFF
      </span>

    </button>


    <button
      class="layer"
      data-layer="visceral"
    >

      <span class="dot viscera-dot"></span>

      Viscera

      <span class="layer-state">
        OFF
      </span>

    </button>


    <div class="divider"></div>


    <div class="section-title">
      Model
    </div>


    <div id="info">
      五個人體系統會使用相同的解剖座標載入。
      點擊上方按鈕可以顯示或隱藏不同系統。
    </div>

  </div>



  <div id="help">
    單指旋轉 · 雙指縮放 / 移動
  </div>



  <script type="module">


    // =====================================
    // IMPORTS
    // =====================================

    import * as THREE
    from "three";


    import {
      OrbitControls
    }
    from
    "three/addons/controls/OrbitControls.js";


    import {
      GLTFLoader
    }
    from
    "three/addons/loaders/GLTFLoader.js";


    import {
      DRACOLoader
    }
    from
    "three/addons/loaders/DRACOLoader.js";



    // =====================================
    // UI
    // =====================================

    const status =
      document.getElementById(
        "status"
      );



    // =====================================
    // SCENE
    // =====================================

    const scene =
      new THREE.Scene();


    scene.background =
      new THREE.Color(
        0x08090b
      );



    // =====================================
    // CAMERA
    // =====================================

    const camera =
      new THREE.PerspectiveCamera(

        35,

        window.innerWidth /
        window.innerHeight,

        0.01,

        10000

      );


    camera.position.set(
      0,
      0,
      5
    );



    // =====================================
    // RENDERER
    // =====================================

    const renderer =
      new THREE.WebGLRenderer({

        antialias: true,

        powerPreference:
          "high-performance"

      });


    renderer.setSize(

      window.innerWidth,

      window.innerHeight

    );


    renderer.setPixelRatio(

      Math.min(

        window.devicePixelRatio,

        1.75

      )

    );


    renderer.outputColorSpace =
      THREE.SRGBColorSpace;


    renderer.toneMapping =
      THREE.ACESFilmicToneMapping;


    renderer.toneMappingExposure =
      0.72;


    document.body.appendChild(
      renderer.domElement
    );



    // =====================================
    // LIGHTING
    // =====================================

    const hemisphereLight =
      new THREE.HemisphereLight(

        0xffffff,

        0x25282d,

        1.15

      );


    scene.add(
      hemisphereLight
    );



    const keyLight =
      new THREE.DirectionalLight(

        0xfff6e8,

        1.8

      );


    keyLight.position.set(
      4,
      6,
      7
    );


    scene.add(
      keyLight
    );



    const fillLight =
      new THREE.DirectionalLight(

        0xcbdcff,

        0.65

      );


    fillLight.position.set(
      -5,
      2,
      4
    );


    scene.add(
      fillLight
    );



    const rimLight =
      new THREE.DirectionalLight(

        0xffffff,

        0.55

      );


    rimLight.position.set(
      0,
      3,
      -5
    );


    scene.add(
      rimLight
    );



    // =====================================
    // CONTROLS
    // =====================================

    const controls =
      new OrbitControls(

        camera,

        renderer.domElement

      );


    controls.enableDamping =
      true;


    controls.dampingFactor =
      0.06;


    controls.enableRotate =
      true;


    controls.enableZoom =
      true;


    controls.enablePan =
      true;



    // =====================================
    // DRACO
    // =====================================

    const dracoLoader =
      new DRACOLoader();


    dracoLoader.setDecoderPath(

      "https://www.gstatic.com/draco/v1/decoders/"

    );



    // =====================================
    // GLTF
    // =====================================

    const loader =
      new GLTFLoader();


    loader.setDRACOLoader(
      dracoLoader
    );



    // =====================================
    // HUMAN ROOT
    //
    // All anatomy systems live inside
    // the same parent group.
    //
    // Later our joint system will be
    // built underneath this hierarchy.
    // =====================================

    const human =
      new THREE.Group();


    human.name =
      "Human";


    scene.add(
      human
    );



    // =====================================
    // LAYERS
    // =====================================

    const layers = {

      skeleton: null,

      muscular: null,

      nervous: null,

      cardiovascular: null,

      visceral: null

    };



    const modelFiles = {

      skeleton:
        "./models/skeleton.glb",

      muscular:
        "./models/muscular.glb",

      nervous:
        "./models/nervous.glb",

      cardiovascular:
        "./models/cardiovascular.glb",

      visceral:
        "./models/visceral.glb"

    };



    // Skeleton visible initially.
    // Other layers initially hidden.

    const initialVisibility = {

      skeleton: true,

      muscular: false,

      nervous: false,

      cardiovascular: false,

      visceral: false

    };



    let loadedCount =
      0;


    const totalModels =
      Object.keys(
        modelFiles
      ).length;



    // =====================================
    // PREPARE MODEL
    // =====================================

    function prepareModel(
      model,
      layerName
    ) {

      model.name =
        layerName;


      model.visible =
        initialVisibility[
          layerName
        ];


      model.traverse(

        function (object) {

          if (
            object.isMesh
          ) {

            object.userData.anatomyLayer =
              layerName;


            object.frustumCulled =
              true;


            if (
              object.material
            ) {

              object.material.side =
                THREE.FrontSide;


              object.material.needsUpdate =
                true;

            }

          }

        }

      );

    }



    // =====================================
    // LOAD ONE MODEL
    // =====================================

    function loadModel(
      layerName,
      file
    ) {

      return new Promise(

        function (
          resolve,
          reject
        ) {

          loader.load(

            file,


            function (gltf) {

              const model =
                gltf.scene;


              prepareModel(
                model,
                layerName
              );


              layers[
                layerName
              ] =
                model;


              human.add(
                model
              );


              loadedCount++;


              status.textContent =

                "● Loading anatomy " +

                loadedCount +

                "/" +

                totalModels;


              console.log(
                "Loaded:",
                layerName,
                model
              );


              resolve(
                model
              );

            },


            undefined,


            function (error) {

              console.error(
                "Failed:",
                layerName,
                error
              );


              reject(
                error
              );

            }

          );

        }

      );

    }



    // =====================================
    // LOAD ALL ANATOMY
    // =====================================

    async function loadAnatomy() {

      try {


        await Promise.all([

          loadModel(
            "skeleton",
            modelFiles.skeleton
          ),

          loadModel(
            "muscular",
            modelFiles.muscular
          ),

          loadModel(
            "nervous",
            modelFiles.nervous
          ),

          loadModel(
            "cardiovascular",
            modelFiles.cardiovascular
          ),

          loadModel(
            "visceral",
            modelFiles.visceral
          )

        ]);



        // =================================
        // Calculate complete anatomy box
        // =================================

        const box =
          new THREE.Box3()
          .setFromObject(
            human
          );


        const center =
          new THREE.Vector3();


        box.getCenter(
          center
        );



        // =================================
        // Move ALL layers together
        //
        // Important:
        // Never centre layers individually.
        // Otherwise anatomy alignment
        // would be destroyed.
        // =================================

        human.position.sub(
          center
        );



        // =================================
        // Recalculate bounding box
        // =================================

        const centeredBox =
          new THREE.Box3()
          .setFromObject(
            human
          );


        const size =
          new THREE.Vector3();


        centeredBox.getSize(
          size
        );



        // =================================
        // CAMERA FIT
        // =================================

        fitCamera(
          size
        );



        status.textContent =
          "● Anatomy loaded";


        status.style.color =
          "#7ee787";


        console.log(
          "All anatomy loaded"
        );


        console.log(
          "Human:",
          human
        );


        console.log(
          "Anatomy size:",
          size
        );


      }

      catch (
        error
      ) {

        console.error(
          error
        );


        status.textContent =
          "● Anatomy loading error";


        status.style.color =
          "#ff6b6b";

      }

    }



    // =====================================
    // FIT CAMERA
    // =====================================

    function fitCamera(
      size
    ) {

      const verticalFOV =
        THREE.MathUtils.degToRad(
          camera.fov
        );


      const distanceHeight =

        size.y /

        (
          2 *

          Math.tan(
            verticalFOV / 2
          )
        );



      const horizontalFOV =

        2 *

        Math.atan(

          Math.tan(
            verticalFOV / 2
          )

          *

          camera.aspect

        );



      const distanceWidth =

        size.x /

        (
          2 *

          Math.tan(
            horizontalFOV / 2
          )
        );



      let distance =

        Math.max(

          distanceHeight,

          distanceWidth

        );


      distance *=
        1.18;



      camera.position.set(

        0,

        0,

        distance

      );



      const maxDimension =

        Math.max(

          size.x,

          size.y,

          size.z

        );



      camera.near =
        Math.max(

          maxDimension /
          1000,

          0.001

        );


      camera.far =
        Math.max(

          maxDimension *
          100,

          distance *
          10

        );


      camera.updateProjectionMatrix();



      controls.target.set(
        0,
        0,
        0
      );


      controls.minDistance =
        distance *
        0.08;


      controls.maxDistance =
        distance *
        6;


      controls.update();

    }



    // =====================================
    // LAYER BUTTONS
    // =====================================

    const layerButtons =
      document.querySelectorAll(
        ".layer"
      );


    layerButtons.forEach(

      function (button) {

        button.addEventListener(

          "click",

          function () {

            const layerName =
              button.dataset.layer;


            const model =
              layers[
                layerName
              ];


            if (
              !model
            ) {

              return;

            }


            model.visible =
              !model.visible;


            button.classList.toggle(
              "active",
              model.visible
            );


            const state =
              button.querySelector(
                ".layer-state"
              );


            state.textContent =
              model.visible
              ? "ON"
              : "OFF";

          }

        );

      }

    );



    // =====================================
    // RESIZE
    // =====================================

    window.addEventListener(

      "resize",

      function () {

        camera.aspect =

          window.innerWidth /

          window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(

          window.innerWidth,

          window.innerHeight

        );

      }

    );



    // =====================================
    // RENDER LOOP
    // =====================================

    function animate() {

      requestAnimationFrame(
        animate
      );


      controls.update();


      renderer.render(

        scene,

        camera

      );

    }



    // =====================================
    // START
    // =====================================

    animate();


    loadAnatomy();


  </script>

</body>

</html>
