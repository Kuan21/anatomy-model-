<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>MJ Anatomy 3D</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #08090b;
      color: white;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }


    /* ==============================
       LEFT PANEL
    ============================== */

    #panel {
      position: fixed;
      top: 18px;
      left: 18px;

      width: 285px;
      max-height: calc(100vh - 36px);

      overflow-y: auto;

      z-index: 20;

      padding: 18px;

      background: rgba(17,19,23,.92);

      border:
        1px solid rgba(255,255,255,.12);

      border-radius: 18px;

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    #panel h1 {
      margin: 0;
      font-size: 21px;
    }

    #subtitle {
      margin-top: 5px;
      color: #969da7;
      font-size: 13px;
    }

    #status {
      margin-top: 12px;
      color: #f0c36a;
      font-size: 12px;
    }

    .divider {
      height: 1px;
      margin: 16px 0;

      background:
        rgba(255,255,255,.10);
    }

    .section-title {
      margin-bottom: 10px;

      color: #aeb5bf;

      font-size: 11px;
      font-weight: 700;

      letter-spacing: 1px;
    }


    /* ==============================
       LAYER BUTTONS
    ============================== */

    .layer {
      display: flex;
      align-items: center;

      width: 100%;

      margin-bottom: 7px;

      padding: 11px 12px;

      border:
        1px solid rgba(255,255,255,.10);

      border-radius: 11px;

      background: #202329;

      color: white;

      font-size: 14px;

      cursor: pointer;
    }

    .layer.active {
      background: #303741;

      border-color:
        rgba(255,255,255,.25);
    }

    .dot {
      width: 10px;
      height: 10px;

      margin-right: 10px;

      border-radius: 50%;
    }

    .bone-dot {
      background: #e8dfca;
    }

    .muscle-dot {
      background: #c95d5d;
    }

    .nerve-dot {
      background: #e6c94c;
    }

    .cardio-dot {
      background: #d65360;
    }

    .viscera-dot {
      background: #c68c7c;
    }

    .layer-state {
      margin-left: auto;

      color: #9da5af;

      font-size: 11px;
    }


    /* ==============================
       MUSCLE PLACEHOLDER
    ============================== */

    .muscle-control {
      display: flex;
      gap: 8px;
    }

    .muscle-button {
      flex: 1;

      padding: 10px;

      border:
        1px solid rgba(255,255,255,.12);

      border-radius: 10px;

      background: #24272d;

      color: white;

      font-size: 13px;
    }

    .muscle-button:disabled {
      opacity: .4;
    }

    #muscle-note {
      margin-top: 8px;

      color: #7f8791;

      font-size: 11px;

      line-height: 1.4;
    }


    /* ==============================
       INSPECT BUTTON
    ============================== */

    #inspectButton {
      width: 100%;

      padding: 11px;

      border: 1px solid #4c78a8;

      border-radius: 11px;

      background: #26384c;

      color: #d9eaff;

      font-size: 13px;
      font-weight: 600;
    }


    /* ==============================
       INSPECTOR
    ============================== */

    #inspector {
      position: fixed;

      top: 18px;
      right: 18px;

      width: 390px;

      height: calc(100vh - 36px);

      z-index: 30;

      display: none;

      flex-direction: column;

      background: rgba(14,16,19,.97);

      border:
        1px solid rgba(255,255,255,.14);

      border-radius: 18px;

      overflow: hidden;

      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    #inspectorHeader {
      padding: 16px;

      border-bottom:
        1px solid rgba(255,255,255,.10);
    }

    #inspectorTitle {
      font-size: 17px;
      font-weight: 700;
    }

    #inspectorSubtitle {
      margin-top: 4px;

      color: #8e969f;

      font-size: 11px;
    }

    #inspectorControls {
      display: flex;

      gap: 7px;

      margin-top: 12px;
    }

    .inspector-button {
      flex: 1;

      padding: 9px;

      border:
        1px solid rgba(255,255,255,.12);

      border-radius: 9px;

      background: #25282e;

      color: white;

      font-size: 12px;
    }

    #closeInspector {
      background: #3b2527;
      color: #ffb8b8;
    }


    /* ==============================
       SEARCH
    ============================== */

    #search {
      width: calc(100% - 30px);

      margin: 12px 15px 4px;

      padding: 10px;

      border:
        1px solid rgba(255,255,255,.12);

      border-radius: 9px;

      outline: none;

      background: #202329;

      color: white;

      font-size: 13px;
    }


    /* ==============================
       RESULTS
    ============================== */

    #meshCount {
      padding:
        7px 15px;

      color: #89919b;

      font-size: 11px;
    }

    #meshList {
      flex: 1;

      overflow-y: auto;

      padding:
        0 12px 15px;
    }

    .mesh-item {
      padding:
        9px 10px;

      margin-bottom: 5px;

      background: #202329;

      border-radius: 8px;

      color: #d8dce1;

      font-family:
        ui-monospace,
        SFMono-Regular,
        Menlo,
        monospace;

      font-size: 11px;

      word-break: break-word;
    }

    .mesh-number {
      color: #707985;
      margin-right: 6px;
    }


    /* ==============================
       HELP
    ============================== */

    #help {
      position: fixed;

      left: 50%;
      bottom: 18px;

      transform:
        translateX(-50%);

      z-index: 15;

      padding:
        9px 15px;

      background:
        rgba(18,20,23,.86);

      border:
        1px solid rgba(255,255,255,.12);

      border-radius: 20px;

      color: #a5abb2;

      font-size: 12px;

      white-space: nowrap;
    }


    /* ==============================
       IPAD / SMALL SCREEN
    ============================== */

    @media (max-width: 900px) {

      #panel {
        width: 250px;
      }

      #inspector {
        width: 360px;
      }

    }

  </style>


  <script type="importmap">
  {
    "imports": {

      "three":
      "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",

      "three/addons/":
      "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"

    }
  }
  </script>

</head>


<body>


  <!-- ==============================
       LEFT CONTROL PANEL
  ============================== -->

  <div id="panel">

    <h1>
      MJ Anatomy 3D
    </h1>

    <div id="subtitle">
      Interactive Human Anatomy
    </div>

    <div id="status">
      ● Loading anatomy...
    </div>


    <div class="divider"></div>


    <div class="section-title">
      ANATOMY LAYERS
    </div>


    <button
      class="layer active"
      data-layer="skeleton"
    >
      <span class="dot bone-dot"></span>

      Skeleton

      <span class="layer-state">
        ON
      </span>
    </button>


    <button
      class="layer"
      data-layer="muscular"
    >
      <span class="dot muscle-dot"></span>

      Muscles

      <span class="layer-state">
        OFF
      </span>
    </button>


    <button
      class="layer"
      data-layer="nervous"
    >
      <span class="dot nerve-dot"></span>

      Nervous System

      <span class="layer-state">
        OFF
      </span>
    </button>


    <button
      class="layer"
      data-layer="cardiovascular"
    >
      <span class="dot cardio-dot"></span>

      Cardiovascular

      <span class="layer-state">
        OFF
      </span>
    </button>


    <button
      class="layer"
      data-layer="visceral"
    >
      <span class="dot viscera-dot"></span>

      Viscera

      <span class="layer-state">
        OFF
      </span>
    </button>



    <div class="divider"></div>


    <!-- Future muscle layers -->

    <div class="section-title">
      MUSCLE DISSECTION
    </div>


    <div class="muscle-control">

      <button
        class="muscle-button"
        disabled
      >
        − Muscle
      </button>


      <button
        class="muscle-button"
        disabled
      >
        + Muscle
      </button>

    </div>


    <div id="muscle-note">
      Inspector 完成後會啟用逐層肌肉加減。
    </div>



    <div class="divider"></div>


    <div class="section-title">
      DEVELOPMENT
    </div>


    <button id="inspectButton">
      Inspect Muscle Model
    </button>

  </div>



  <!-- ==============================
       MODEL INSPECTOR
  ============================== -->

  <div id="inspector">


    <div id="inspectorHeader">

      <div id="inspectorTitle">
        Muscular Model Inspector
      </div>

      <div id="inspectorSubtitle">
        muscular.glb — object / mesh names
      </div>


      <div id="inspectorControls">

        <button
          id="copyInspector"
          class="inspector-button"
        >
          Copy All
        </button>

        <button
          id="closeInspector"
          class="inspector-button"
        >
          Close
        </button>

      </div>

    </div>


    <input
      id="search"
      type="text"
      placeholder="Search mesh name..."
    >


    <div id="meshCount">
      Waiting for model...
    </div>


    <div id="meshList">
    </div>

  </div>



  <div id="help">
    單指旋轉 · 雙指縮放 / 移動
  </div>



  <script type="module">


    // =====================================
    // IMPORTS
    // =====================================

    import * as THREE
    from "three";


    import {
      OrbitControls
    }
    from
    "three/addons/controls/OrbitControls.js";


    import {
      GLTFLoader
    }
    from
    "three/addons/loaders/GLTFLoader.js";


    import {
      DRACOLoader
    }
    from
    "three/addons/loaders/DRACOLoader.js";



    // =====================================
    // UI
    // =====================================

    const status =
      document.getElementById(
        "status"
      );


    const inspector =
      document.getElementById(
        "inspector"
      );


    const meshList =
      document.getElementById(
        "meshList"
      );


    const meshCount =
      document.getElementById(
        "meshCount"
      );


    const search =
      document.getElementById(
        "search"
      );



    // =====================================
    // SCENE
    // =====================================

    const scene =
      new THREE.Scene();


    scene.background =
      new THREE.Color(
        0x08090b
      );



    // =====================================
    // CAMERA
    // =====================================

    const camera =
      new THREE.PerspectiveCamera(

        35,

        window.innerWidth /
        window.innerHeight,

        0.01,

        10000

      );


    camera.position.set(
      0,
      0,
      5
    );



    // =====================================
    // RENDERER
    // =====================================

    const renderer =
      new THREE.WebGLRenderer({

        antialias: true,

        powerPreference:
          "high-performance"

      });


    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );


    renderer.setPixelRatio(

      Math.min(
        window.devicePixelRatio,
        1.75
      )

    );


    renderer.outputColorSpace =
      THREE.SRGBColorSpace;


    renderer.toneMapping =
      THREE.ACESFilmicToneMapping;


    renderer.toneMappingExposure =
      0.72;


    document.body.appendChild(
      renderer.domElement
    );



    // =====================================
    // LIGHTS
    // =====================================

    scene.add(

      new THREE.HemisphereLight(

        0xffffff,
        0x25282d,
        1.15

      )

    );



    const keyLight =
      new THREE.DirectionalLight(

        0xfff6e8,
        1.8

      );


    keyLight.position.set(
      4,
      6,
      7
    );


    scene.add(
      keyLight
    );



    const fillLight =
      new THREE.DirectionalLight(

        0xcbdcff,
        0.65

      );


    fillLight.position.set(
      -5,
      2,
      4
    );


    scene.add(
      fillLight
    );



    const rimLight =
      new THREE.DirectionalLight(

        0xffffff,
        0.55

      );


    rimLight.position.set(
      0,
      3,
      -5
    );


    scene.add(
      rimLight
    );



    // =====================================
    // CONTROLS
    // =====================================

    const controls =
      new OrbitControls(

        camera,
        renderer.domElement

      );


    controls.enableDamping =
      true;


    controls.dampingFactor =
      0.06;


    controls.enableRotate =
      true;


    controls.enableZoom =
      true;


    controls.enablePan =
      true;



    // =====================================
    // DRACO
    // =====================================

    const dracoLoader =
      new DRACOLoader();


    dracoLoader.setDecoderPath(

      "https://www.gstatic.com/draco/v1/decoders/"

    );



    // =====================================
    // GLTF LOADER
    // =====================================

    const loader =
      new GLTFLoader();


    loader.setDRACOLoader(
      dracoLoader
    );



    // =====================================
    // HUMAN
    // =====================================

    const human =
      new THREE.Group();


    scene.add(
      human
    );



    const layers = {

      skeleton: null,

      muscular: null,

      nervous: null,

      cardiovascular: null,

      visceral: null

    };



    const files = {

      skeleton:
        "./models/skeleton.glb",

      muscular:
        "./models/muscular.glb",

      nervous:
        "./models/nervous.glb",

      cardiovascular:
        "./models/cardiovascular.glb",

      visceral:
        "./models/visceral.glb"

    };



    const initialVisibility = {

      skeleton: true,

      muscular: false,

      nervous: false,

      cardiovascular: false,

      visceral: false

    };



    // =====================================
    // MUSCLE INSPECTOR DATA
    // =====================================

    let muscleObjects = [];



    function collectMuscleObjects(
      model
    ) {

      muscleObjects = [];


      model.traverse(

        function (object) {


          if (
            object === model
          ) {
            return;
          }


          const type =
            object.type || "Object3D";


          const name =
            object.name &&
            object.name.trim() !== ""

            ? object.name

            : "(unnamed)";


          muscleObjects.push({

            name: name,

            type: type,

            uuid: object.uuid,

            isMesh:
              object.isMesh === true,

            childCount:
              object.children.length

          });

        }

      );


      console.log(
        "Muscular objects:",
        muscleObjects
      );

    }



    // =====================================
    // LOAD MODEL
    // =====================================

    function loadModel(
      name,
      file
    ) {

      return new Promise(

        function (
          resolve,
          reject
        ) {

          loader.load(

            file,


            function (gltf) {

              const model =
                gltf.scene;


              model.name =
                name;


              model.visible =
                initialVisibility[
                  name
                ];


              model.traverse(

                function (object) {

                  if (
                    object.isMesh
                  ) {

                    object.userData.anatomyLayer =
                      name;


                    if (
                      object.material
                    ) {

                      object.material.side =
                        THREE.FrontSide;


                      object.material.needsUpdate =
                        true;

                    }

                  }

                }

              );


              layers[name] =
                model;


              human.add(
                model
              );


              if (
                name === "muscular"
              ) {

                collectMuscleObjects(
                  model
                );

              }


              resolve(
                model
              );

            },


            undefined,


            function (error) {

              console.error(
                name,
                error
              );


              reject(
                error
              );

            }

          );

        }

      );

    }



    // =====================================
    // LOAD ANATOMY
    // =====================================

    async function loadAnatomy() {

      try {


        await Promise.all([

          loadModel(
            "skeleton",
            files.skeleton
          ),

          loadModel(
            "muscular",
            files.muscular
          ),

          loadModel(
            "nervous",
            files.nervous
          ),

          loadModel(
            "cardiovascular",
            files.cardiovascular
          ),

          loadModel(
            "visceral",
            files.visceral
          )

        ]);



        // =================================
        // IMPORTANT:
        // Use skeleton bounding box
        // to centre all anatomy together.
        // =================================

        const box =
          new THREE.Box3()
          .setFromObject(
            layers.skeleton
          );


        const center =
          new THREE.Vector3();


        const size =
          new THREE.Vector3();


        box.getCenter(
          center
        );


        box.getSize(
          size
        );


        human.position.sub(
          center
        );


        fitCamera(
          size
        );



        status.textContent =
          "● Anatomy loaded";


        status.style.color =
          "#7ee787";


      }

      catch (
        error
      ) {


        console.error(
          error
        );


        status.textContent =
          "● Anatomy loading error";


        status.style.color =
          "#ff6b6b";

      }

    }



    // =====================================
    // CAMERA FIT
    // =====================================

    function fitCamera(
      size
    ) {

      const vFov =
        THREE.MathUtils.degToRad(
          camera.fov
        );


      const heightDistance =

        size.y /

        (
          2 *
          Math.tan(
            vFov / 2
          )
        );



      const hFov =

        2 *

        Math.atan(

          Math.tan(
            vFov / 2
          )

          *

          camera.aspect

        );



      const widthDistance =

        size.x /

        (
          2 *
          Math.tan(
            hFov / 2
          )
        );



      let distance =

        Math.max(

          heightDistance,

          widthDistance

        );


      distance *=
        1.18;



      camera.position.set(
        0,
        0,
        distance
      );


      const maxSize =
        Math.max(

          size.x,
          size.y,
          size.z

        );


      camera.near =
        Math.max(

          maxSize / 1000,

          0.001

        );


      camera.far =
        maxSize * 100;


      camera.updateProjectionMatrix();



      controls.target.set(
        0,
        0,
        0
      );


      controls.minDistance =
        distance * 0.08;


      controls.maxDistance =
        distance * 6;


      controls.update();

    }



    // =====================================
    // ANATOMY LAYER BUTTONS
    // =====================================

    document
      .querySelectorAll(
        ".layer"
      )
      .forEach(

        function (button) {


          button.addEventListener(

            "click",

            function () {


              const name =
                button.dataset.layer;


              const model =
                layers[name];


              if (
                !model
              ) {
                return;
              }


              model.visible =
                !model.visible;


              button
                .classList
                .toggle(
                  "active",
                  model.visible
                );


              button
                .querySelector(
                  ".layer-state"
                )
                .textContent =

                  model.visible
                  ? "ON"
                  : "OFF";

            }

          );

        }

      );



    // =====================================
    // RENDER INSPECTOR
    // =====================================

    function renderInspector(
      filter = ""
    ) {


      meshList.innerHTML =
        "";


      const lowerFilter =
        filter.toLowerCase();


      const filtered =
        muscleObjects.filter(

          function (item) {


            if (
              lowerFilter === ""
            ) {

              return true;

            }


            return (

              item.name
                .toLowerCase()
                .includes(
                  lowerFilter
                )

              ||

              item.type
                .toLowerCase()
                .includes(
                  lowerFilter
                )

            );

          }

        );



      meshCount.textContent =

        filtered.length +

        " objects shown / " +

        muscleObjects.length +

        " total";



      filtered.forEach(

        function (
          item,
          index
        ) {


          const div =
            document.createElement(
              "div"
            );


          div.className =
            "mesh-item";


          div.textContent =

            (index + 1) +

            ". [" +

            item.type +

            "] " +

            item.name;


          meshList.appendChild(
            div
          );

        }

      );

    }



    // =====================================
    // OPEN INSPECTOR
    // =====================================

    document
      .getElementById(
        "inspectButton"
      )
      .addEventListener(

        "click",

        function () {


          inspector.style.display =
            "flex";


          renderInspector(
            search.value
          );

        }

      );



    // =====================================
    // CLOSE
    // =====================================

    document
      .getElementById(
        "closeInspector"
      )
      .addEventListener(

        "click",

        function () {

          inspector.style.display =
            "none";

        }

      );



    // =====================================
    // SEARCH
    // =====================================

    search.addEventListener(

      "input",

      function () {

        renderInspector(
          search.value
        );

      }

    );



    // =====================================
    // COPY INSPECTOR
    // =====================================

    document
      .getElementById(
        "copyInspector"
      )
      .addEventListener(

        "click",

        async function () {


          const lines =
            muscleObjects.map(

              function (
                item,
                index
              ) {

                return (

                  (index + 1) +

                  ". [" +

                  item.type +

                  "] " +

                  item.name

                );

              }

            );


          const text =
            lines.join(
              "\n"
            );


          try {


            await navigator
              .clipboard
              .writeText(
                text
              );


            this.textContent =
              "Copied ✓";


            const button =
              this;


            setTimeout(

              function () {

                button.textContent =
                  "Copy All";

              },

              1500

            );


          }

          catch (
            error
          ) {


            console.error(
              error
            );


            this.textContent =
              "Copy failed";

          }

        }

      );



    // =====================================
    // RESIZE
    // =====================================

    window.addEventListener(

      "resize",

      function () {


        camera.aspect =

          window.innerWidth /

          window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(

          window.innerWidth,

          window.innerHeight

        );

      }

    );



    // =====================================
    // RENDER LOOP
    // =====================================

    function animate() {


      requestAnimationFrame(
        animate
      );


      controls.update();


      renderer.render(
        scene,
        camera
      );

    }



    // =====================================
    // START
    // =====================================

    animate();


    loadAnatomy();


  </script>

</body>

</html>
