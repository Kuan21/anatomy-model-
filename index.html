<!DOCTYPE html>
<html lang="zh-Hant">

<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>MJ Anatomy 3D</title>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;

  background: #08090b;
  color: white;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}

canvas {
  display: block;
  width: 100%;
  height: 100%;
  touch-action: none;
}


/* ========================================
   LEFT PANEL
======================================== */

#panel {

  position: fixed;

  top: 18px;
  left: 18px;

  z-index: 20;

  width: 285px;

  max-height:
    calc(100vh - 36px);

  overflow-y: auto;

  padding: 18px;

  background:
    rgba(17,19,23,.92);

  border:
    1px solid
    rgba(255,255,255,.12);

  border-radius: 18px;

  backdrop-filter:
    blur(18px);

  -webkit-backdrop-filter:
    blur(18px);

  box-shadow:
    0 12px 40px
    rgba(0,0,0,.35);
}


#panel h1 {

  margin: 0;

  font-size: 21px;

}


#subtitle {

  margin-top: 5px;

  color: #969da7;

  font-size: 13px;

}


#status {

  margin-top: 12px;

  color: #f0c36a;

  font-size: 12px;

}


.divider {

  height: 1px;

  margin: 16px 0;

  background:
    rgba(255,255,255,.10);

}


.section-title {

  margin-bottom: 10px;

  color: #aeb5bf;

  font-size: 11px;

  font-weight: 700;

  letter-spacing: 1px;

}



/* ========================================
   LAYER BUTTON
======================================== */

.layer {

  display: flex;

  align-items: center;

  width: 100%;

  margin-bottom: 7px;

  padding: 11px 12px;

  border:
    1px solid
    rgba(255,255,255,.10);

  border-radius: 11px;

  background: #202329;

  color: white;

  font-size: 14px;

  cursor: pointer;

  -webkit-tap-highlight-color:
    transparent;
}


.layer.active {

  background: #303741;

  border-color:
    rgba(255,255,255,.25);

}


.dot {

  width: 10px;

  height: 10px;

  margin-right: 10px;

  border-radius: 50%;

}


.bone-dot {
  background: #e8dfca;
}

.muscle-dot {
  background: #c95d5d;
}

.nerve-dot {
  background: #e6c94c;
}

.cardio-dot {
  background: #d65360;
}

.viscera-dot {
  background: #c68c7c;
}


.layer-state {

  margin-left: auto;

  color: #9da5af;

  font-size: 11px;

}



/* ========================================
   MUSCLE DISSECTION
======================================== */

#muscleStage {

  padding: 12px;

  margin-bottom: 9px;

  background: #1d2025;

  border:
    1px solid
    rgba(255,255,255,.09);

  border-radius: 11px;

}


#muscleStageLabel {

  font-size: 14px;

  font-weight: 600;

}


#muscleStageDescription {

  margin-top: 4px;

  color: #8e969f;

  font-size: 11px;

  line-height: 1.4;

}


#depthBar {

  display: flex;

  gap: 4px;

  margin-top: 10px;

}


.depth-segment {

  flex: 1;

  height: 4px;

  background: #343941;

  border-radius: 5px;

}


.depth-segment.active {

  background: #c95d5d;

}


.muscle-controls {

  display: flex;

  gap: 8px;

}


.muscle-control {

  flex: 1;

  padding: 11px 8px;

  border:
    1px solid
    rgba(255,255,255,.12);

  border-radius: 11px;

  background: #282c32;

  color: white;

  font-size: 13px;

  font-weight: 600;

  cursor: pointer;

}


.muscle-control:disabled {

  opacity: .32;

}


#resetMuscles {

  width: 100%;

  margin-top: 8px;

  padding: 9px;

  border:
    1px solid
    rgba(255,255,255,.10);

  border-radius: 9px;

  background: transparent;

  color: #9ba3ad;

  font-size: 11px;

}



/* ========================================
   INFO
======================================== */

#info {

  color: #8e959e;

  font-size: 11px;

  line-height: 1.5;

}



/* ========================================
   HELP
======================================== */

#help {

  position: fixed;

  left: 50%;

  bottom: 18px;

  transform:
    translateX(-50%);

  z-index: 15;

  padding: 9px 15px;

  background:
    rgba(18,20,23,.86);

  border:
    1px solid
    rgba(255,255,255,.12);

  border-radius: 20px;

  color: #a5abb2;

  font-size: 12px;

  white-space: nowrap;

}



/* ========================================
   MOBILE / IPAD
======================================== */

@media (max-width: 700px) {

  #panel {

    top: 10px;

    left: 10px;

    width: 245px;

    padding: 14px;

  }

  #panel h1 {

    font-size: 18px;

  }

  .layer {

    padding: 9px 10px;

  }

}

</style>



<script type="importmap">

{
  "imports": {

    "three":
    "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",

    "three/addons/":
    "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"

  }
}

</script>

</head>



<body>


<!-- ======================================
     CONTROL PANEL
======================================= -->

<div id="panel">


  <h1>
    MJ Anatomy 3D
  </h1>


  <div id="subtitle">
    Interactive Human Anatomy
  </div>


  <div id="status">
    ● Loading anatomy...
  </div>



  <div class="divider"></div>



  <!-- ==================================
       ANATOMY LAYERS
  =================================== -->

  <div class="section-title">
    ANATOMY LAYERS
  </div>



  <button
    class="layer active"
    data-layer="skeleton"
  >

    <span
      class="dot bone-dot"
    ></span>

    Skeleton

    <span class="layer-state">
      ON
    </span>

  </button>



  <button
    class="layer active"
    data-layer="muscular"
  >

    <span
      class="dot muscle-dot"
    ></span>

    Muscles

    <span class="layer-state">
      ON
    </span>

  </button>



  <button
    class="layer"
    data-layer="nervous"
  >

    <span
      class="dot nerve-dot"
    ></span>

    Nervous System

    <span class="layer-state">
      OFF
    </span>

  </button>



  <button
    class="layer"
    data-layer="cardiovascular"
  >

    <span
      class="dot cardio-dot"
    ></span>

    Cardiovascular

    <span class="layer-state">
      OFF
    </span>

  </button>



  <button
    class="layer"
    data-layer="visceral"
  >

    <span
      class="dot viscera-dot"
    ></span>

    Viscera

    <span class="layer-state">
      OFF
    </span>

  </button>



  <div class="divider"></div>



  <!-- ==================================
       MUSCLE DISSECTION
  =================================== -->

  <div class="section-title">
    MUSCLE DISSECTION
  </div>



  <div id="muscleStage">


    <div id="muscleStageLabel">
      Full Musculature
    </div>


    <div id="muscleStageDescription">
      Complete muscular system
    </div>


    <div id="depthBar">

      <div
        class="depth-segment active"
      ></div>

      <div
        class="depth-segment active"
      ></div>

      <div
        class="depth-segment active"
      ></div>

      <div
        class="depth-segment active"
      ></div>

    </div>


  </div>



  <div class="muscle-controls">


    <button
      id="muscleMinus"
      class="muscle-control"
    >
      − Muscle
    </button>


    <button
      id="musclePlus"
      class="muscle-control"
    >
      + Muscle
    </button>


  </div>



  <button id="resetMuscles">
    Restore all muscles
  </button>



  <div class="divider"></div>



  <div id="info">

    Muscle −：
    逐步移除較表層肌肉。

    <br><br>

    Muscle +：
    逐步加回肌肉。

    <br><br>

    不同身體區域的肌肉深度並不完全相同，
    系統會按主要解剖層次顯示。

  </div>


</div>



<div id="help">

  單指旋轉 · 雙指縮放 / 移動

</div>



<script type="module">


// =========================================
// IMPORTS
// =========================================

import * as THREE
from "three";


import {
  OrbitControls
}
from
"three/addons/controls/OrbitControls.js";


import {
  GLTFLoader
}
from
"three/addons/loaders/GLTFLoader.js";


import {
  DRACOLoader
}
from
"three/addons/loaders/DRACOLoader.js";



// =========================================
// UI
// =========================================

const status =
  document.getElementById(
    "status"
  );


const stageLabel =
  document.getElementById(
    "muscleStageLabel"
  );


const stageDescription =
  document.getElementById(
    "muscleStageDescription"
  );


const minusButton =
  document.getElementById(
    "muscleMinus"
  );


const plusButton =
  document.getElementById(
    "musclePlus"
  );


const resetButton =
  document.getElementById(
    "resetMuscles"
  );


const depthSegments =
  document.querySelectorAll(
    ".depth-segment"
  );



// =========================================
// SCENE
// =========================================

const scene =
  new THREE.Scene();


scene.background =
  new THREE.Color(
    0x08090b
  );



// =========================================
// CAMERA
// =========================================

const camera =
  new THREE.PerspectiveCamera(

    35,

    window.innerWidth /
    window.innerHeight,

    0.01,

    10000

  );


camera.position.set(
  0,
  0,
  5
);



// =========================================
// RENDERER
// =========================================

const renderer =
  new THREE.WebGLRenderer({

    antialias: true,

    powerPreference:
      "high-performance"

  });


renderer.setSize(

  window.innerWidth,

  window.innerHeight

);


renderer.setPixelRatio(

  Math.min(

    window.devicePixelRatio,

    1.75

  )

);


renderer.outputColorSpace =
  THREE.SRGBColorSpace;


renderer.toneMapping =
  THREE.ACESFilmicToneMapping;


renderer.toneMappingExposure =
  0.72;


document.body.appendChild(
  renderer.domElement
);



// =========================================
// LIGHTING
// =========================================

scene.add(

  new THREE.HemisphereLight(

    0xffffff,

    0x25282d,

    1.1

  )

);



const keyLight =
  new THREE.DirectionalLight(

    0xfff4e5,

    1.7

  );


keyLight.position.set(
  4,
  6,
  7
);


scene.add(
  keyLight
);



const fillLight =
  new THREE.DirectionalLight(

    0xcbdcff,

    0.6

  );


fillLight.position.set(
  -5,
  2,
  4
);


scene.add(
  fillLight
);



const rimLight =
  new THREE.DirectionalLight(

    0xffffff,

    0.5

  );


rimLight.position.set(
  0,
  3,
  -5
);


scene.add(
  rimLight
);



// =========================================
// CONTROLS
// =========================================

const controls =
  new OrbitControls(

    camera,

    renderer.domElement

  );


controls.enableDamping =
  true;


controls.dampingFactor =
  0.06;


controls.enableRotate =
  true;


controls.enableZoom =
  true;


controls.enablePan =
  true;



// =========================================
// DRACO
// =========================================

const dracoLoader =
  new DRACOLoader();


dracoLoader.setDecoderPath(

  "https://www.gstatic.com/draco/v1/decoders/"

);



// =========================================
// GLTF
// =========================================

const loader =
  new GLTFLoader();


loader.setDRACOLoader(
  dracoLoader
);



// =========================================
// HUMAN ROOT
// =========================================

const human =
  new THREE.Group();


human.name =
  "Human";


scene.add(
  human
);



// =========================================
// ANATOMY LAYERS
// =========================================

const layers = {

  skeleton: null,

  muscular: null,

  nervous: null,

  cardiovascular: null,

  visceral: null

};



const files = {

  skeleton:
    "./models/skeleton.glb",

  muscular:
    "./models/muscular.glb",

  nervous:
    "./models/nervous.glb",

  cardiovascular:
    "./models/cardiovascular.glb",

  visceral:
    "./models/visceral.glb"

};



const initialVisibility = {

  skeleton: true,

  muscular: true,

  nervous: false,

  cardiovascular: false,

  visceral: false

};



// =========================================
// MUSCLE DATA
// =========================================

let muscleMeshes = [];


/*
  Depth system

  4 = superficial
  3 = intermediate-superficial
  2 = intermediate-deep
  1 = deep

  This is a viewer/dissection grouping.
  Human anatomy does not consist of one
  universal four-layer arrangement across
  every region.
*/


function muscleDepth(
  rawName
) {


  const name =
    rawName
      .toLowerCase();


  // =======================================
  // DEEP — LEVEL 1
  // =======================================

  const deepPatterns = [

    "subscapularis",

    "supraspinatus",

    "infraspinatus",

    "teres_minor",

    "pectoralis_minor",

    "transversus_abdominis",

    "innermost_intercostal",

    "internal_intercostal",

    "multifidus",

    "rotatores",

    "interspinales",

    "intertransversarii",

    "suboccipital",

    "longus_colli",

    "longus_capitis",

    "rectus_anterior_capitis",

    "rectus_lateralis_capitis",

    "pronator_quadratus",

    "flexor_digitorum_profundus",

    "flexor_pollicis_longus",

    "supinator",

    "deep_part_of",

    "gluteus_minimus",

    "obturator_internus",

    "obturator_externus",

    "quadratus_femoris",

    "gemellus",

    "popliteus",

    "tibialis_posterior",

    "flexor_hallucis_longus",

    "flexor_digitorum_longus",

    "dorsal_interossei",

    "palmar_interossei",

    "plantar_interossei",

    "lumbrical",

    "quadratus_plantae",

    "adductor_hallucis",

    "adductor_pollicis",

    "pterygoid",

    "genioglossus",

    "hyoglossus"

  ];



  // =======================================
  // INTERMEDIATE-DEEP — LEVEL 2
  // =======================================

  const intermediateDeepPatterns = [

    "rhomboid",

    "levator_scapulae",

    "serratus_posterior",

    "serratus_anterior",

    "external_intercostal",

    "internal_abdominal_oblique",

    "quadratus_lumborum",

    "iliocostalis",

    "longissimus",

    "spinalis",

    "semispinalis",

    "splenius",

    "brachialis",

    "coracobrachialis",

    "pronator_teres",

    "flexor_digitorum_superficialis",

    "extensor_pollicis",

    "abductor_pollicis_longus",

    "extensor_indicis",

    "gluteus_medius",

    "piriformis",

    "adductor_brevis",

    "adductor_magnus",

    "vastus_intermedius",

    "soleus",

    "plantaris",

    "flexor_hallucis_brevis",

    "temporalis",

    "masseter",

    "scalenus"

  ];



  // =======================================
  // INTERMEDIATE-SUPERFICIAL — LEVEL 3
  // =======================================

  const intermediatePatterns = [

    "biceps_brachii",

    "triceps_brachii",

    "brachialis",

    "brachioradialis",

    "flexor_carpi",

    "extensor_carpi",

    "extensor_digitorum",

    "flexor_digitorum_superficialis",

    "rectus_abdominis",

    "gluteus_medius",

    "adductor_longus",

    "gracilis",

    "pectineus",

    "rectus_femoris",

    "vastus_lateralis",

    "vastus_medialis",

    "biceps_femoris",

    "semimembranosus",

    "semitendinosus",

    "soleus",

    "fibularis_brevis",

    "extensor_hallucis_longus",

    "extensor_digitorum_longus",

    "sternohyoid",

    "sternothyroid",

    "omohyoid",

    "thyrohyoid"

  ];



  // =======================================
  // TEST DEEP FIRST
  // =======================================

  for (
    const pattern
    of deepPatterns
  ) {

    if (
      name.includes(
        pattern
      )
    ) {

      return 1;

    }

  }



  for (
    const pattern
    of intermediateDeepPatterns
  ) {

    if (
      name.includes(
        pattern
      )
    ) {

      return 2;

    }

  }



  for (
    const pattern
    of intermediatePatterns
  ) {

    if (
      name.includes(
        pattern
      )
    ) {

      return 3;

    }

  }



  // =======================================
  // EVERYTHING ELSE DEFAULTS TO
  // SUPERFICIAL LEVEL 4
  // =======================================

  return 4;

}



// =========================================
// NON-MUSCLE STRUCTURES INSIDE
// muscular.glb
// =========================================

function isAccessoryStructure(
  rawName
) {


  const name =
    rawName.toLowerCase();


  const patterns = [

    "fascia",

    "aponeurosis",

    "bursa",

    "retinaculum",

    "ligament",

    "tendon_sheath",

    "tendinous_arch",

    "intermuscular_septum",

    "tarsus",

    "trochlea",

    "common_tendinous_ring"

  ];


  return patterns.some(

    pattern =>
      name.includes(
        pattern
      )

  );

}



// =========================================
// PREPARE MUSCLES
// =========================================

function prepareMuscles(
  model
) {


  muscleMeshes = [];


  model.traverse(

    function (
      object
    ) {


      if (
        !object.isMesh
      ) {

        return;

      }


      const accessory =
        isAccessoryStructure(
          object.name
        );


      const depth =
        muscleDepth(
          object.name
        );


      object.userData.isAccessory =
        accessory;


      object.userData.muscleDepth =
        depth;


      muscleMeshes.push(
        object
      );

    }

  );


  console.log(

    "Muscle meshes:",

    muscleMeshes.length

  );


  console.log(

    "Depth 4:",

    muscleMeshes.filter(
      m =>
      m.userData.muscleDepth === 4
    ).length

  );


  console.log(

    "Depth 3:",

    muscleMeshes.filter(
      m =>
      m.userData.muscleDepth === 3
    ).length

  );


  console.log(

    "Depth 2:",

    muscleMeshes.filter(
      m =>
      m.userData.muscleDepth === 2
    ).length

  );


  console.log(

    "Depth 1:",

    muscleMeshes.filter(
      m =>
      m.userData.muscleDepth === 1
    ).length

  );

}



// =========================================
// MUSCLE STAGE
//
// 4 = full
// 3 = remove superficial
// 2 = deeper
// 1 = deepest
// 0 = skeleton
// =========================================

let currentMuscleStage =
  4;



const stageInformation = {

  4: {

    label:
      "Full Musculature",

    description:
      "Complete muscular system"

  },


  3: {

    label:
      "Superficial Dissection",

    description:
      "Major superficial muscles removed"

  },


  2: {

    label:
      "Intermediate Layer",

    description:
      "Intermediate and deep muscles"

  },


  1: {

    label:
      "Deep Muscles",

    description:
      "Deep anatomical muscle groups"

  },


  0: {

    label:
      "Skeleton",

    description:
      "Muscular layer removed"

  }

};



// =========================================
// UPDATE MUSCLE DISPLAY
// =========================================

function updateMuscleStage() {


  const muscular =
    layers.muscular;


  if (
    !muscular
  ) {

    return;

  }



  // =======================================
  // STAGE 0
  // =======================================

  if (
    currentMuscleStage === 0
  ) {


    muscular.visible =
      false;


  }

  else {


    muscular.visible =
      true;



    muscleMeshes.forEach(

      function (
        mesh
      ) {


        const depth =
          mesh.userData.muscleDepth;


        /*
          Example:

          Stage 4:
          show depth 1,2,3,4

          Stage 3:
          show depth 1,2,3

          Stage 2:
          show depth 1,2

          Stage 1:
          show depth 1
        */


        mesh.visible =

          depth <=
          currentMuscleStage;

      }

    );

  }



  // =======================================
  // UPDATE TEXT
  // =======================================

  const info =
    stageInformation[
      currentMuscleStage
    ];


  stageLabel.textContent =
    info.label;


  stageDescription.textContent =
    info.description;



  // =======================================
  // DEPTH BAR
  // =======================================

  depthSegments.forEach(

    function (
      segment,
      index
    ) {


      const level =
        index + 1;


      segment.classList.toggle(

        "active",

        level <=
        currentMuscleStage

      );

    }

  );



  // =======================================
  // BUTTON LIMITS
  // =======================================

  minusButton.disabled =

    currentMuscleStage === 0;


  plusButton.disabled =

    currentMuscleStage === 4;



  // =======================================
  // UPDATE MUSCLE LAYER BUTTON
  // =======================================

  const muscleLayerButton =

    document.querySelector(

      '[data-layer="muscular"]'

    );


  const muscleState =

    muscleLayerButton
      .querySelector(
        ".layer-state"
      );


  const muscleVisible =

    currentMuscleStage > 0;


  muscleLayerButton
    .classList
    .toggle(

      "active",

      muscleVisible

    );


  muscleState.textContent =

    muscleVisible
    ? "ON"
    : "OFF";

}



// =========================================
// MUSCLE MINUS
// =========================================

minusButton.addEventListener(

  "click",

  function () {


    if (
      currentMuscleStage > 0
    ) {


      currentMuscleStage--;


      updateMuscleStage();

    }

  }

);



// =========================================
// MUSCLE PLUS
// =========================================

plusButton.addEventListener(

  "click",

  function () {


    if (
      currentMuscleStage < 4
    ) {


      currentMuscleStage++;


      updateMuscleStage();

    }

  }

);



// =========================================
// RESTORE MUSCLES
// =========================================

resetButton.addEventListener(

  "click",

  function () {


    currentMuscleStage =
      4;


    updateMuscleStage();

  }

);



// =========================================
// LOAD MODEL
// =========================================

function loadModel(
  name,
  file
) {


  return new Promise(

    function (
      resolve,
      reject
    ) {


      loader.load(


        file,


        function (
          gltf
        ) {


          const model =
            gltf.scene;


          model.name =
            name;


          model.visible =
            initialVisibility[
              name
            ];


          model.traverse(

            function (
              object
            ) {


              if (
                object.isMesh
              ) {


                object.userData.anatomyLayer =
                  name;


                if (
                  object.material
                ) {


                  object.material.side =
                    THREE.FrontSide;


                  object.material.needsUpdate =
                    true;

                }

              }

            }

          );



          layers[
            name
          ] =
            model;


          human.add(
            model
          );



          if (
            name ===
            "muscular"
          ) {


            prepareMuscles(
              model
            );

          }



          resolve(
            model
          );

        },


        undefined,


        function (
          error
        ) {


          console.error(
            "Failed:",
            name,
            error
          );


          reject(
            error
          );

        }


      );

    }

  );

}



// =========================================
// LOAD ALL ANATOMY
// =========================================

async function loadAnatomy() {


  try {


    await Promise.all([


      loadModel(

        "skeleton",

        files.skeleton

      ),


      loadModel(

        "muscular",

        files.muscular

      ),


      loadModel(

        "nervous",

        files.nervous

      ),


      loadModel(

        "cardiovascular",

        files.cardiovascular

      ),


      loadModel(

        "visceral",

        files.visceral

      )


    ]);



    // =====================================
    // CENTRE USING SKELETON
    // =====================================

    const box =
      new THREE.Box3()
      .setFromObject(
        layers.skeleton
      );


    const center =
      new THREE.Vector3();


    const size =
      new THREE.Vector3();


    box.getCenter(
      center
    );


    box.getSize(
      size
    );


    human.position.sub(
      center
    );



    // =====================================
    // CAMERA
    // =====================================

    fitCamera(
      size
    );



    // =====================================
    // MUSCLE STAGE
    // =====================================

    updateMuscleStage();



    status.textContent =
      "● Anatomy loaded";


    status.style.color =
      "#7ee787";


  }

  catch (
    error
  ) {


    console.error(
      error
    );


    status.textContent =
      "● Anatomy loading error";


    status.style.color =
      "#ff6b6b";

  }

}



// =========================================
// CAMERA FIT
// =========================================

function fitCamera(
  size
) {


  const vFov =

    THREE.MathUtils
      .degToRad(
        camera.fov
      );


  const heightDistance =

    size.y /

    (
      2 *

      Math.tan(
        vFov / 2
      )
    );



  const hFov =

    2 *

    Math.atan(

      Math.tan(
        vFov / 2
      )

      *

      camera.aspect

    );



  const widthDistance =

    size.x /

    (
      2 *

      Math.tan(
        hFov / 2
      )
    );



  let distance =

    Math.max(

      heightDistance,

      widthDistance

    );


  distance *=
    1.18;



  camera.position.set(

    0,

    0,

    distance

  );



  const maxSize =

    Math.max(

      size.x,

      size.y,

      size.z

    );



  camera.near =

    Math.max(

      maxSize / 1000,

      0.001

    );


  camera.far =

    maxSize *
    100;


  camera.updateProjectionMatrix();



  controls.target.set(
    0,
    0,
    0
  );


  controls.minDistance =
    distance *
    0.08;


  controls.maxDistance =
    distance *
    6;


  controls.update();

}



// =========================================
// GENERAL LAYER BUTTONS
// =========================================

document
  .querySelectorAll(
    ".layer"
  )
  .forEach(

    function (
      button
    ) {


      button.addEventListener(

        "click",

        function () {


          const name =
            button.dataset.layer;


          const model =
            layers[
              name
            ];


          if (
            !model
          ) {

            return;

          }



          // =================================
          // MUSCLE BUTTON SPECIAL BEHAVIOUR
          // =================================

          if (
            name ===
            "muscular"
          ) {


            if (
              currentMuscleStage === 0
            ) {


              currentMuscleStage =
                4;


            }

            else {


              currentMuscleStage =
                0;

            }


            updateMuscleStage();


            return;

          }



          // =================================
          // OTHER LAYERS
          // =================================

          model.visible =
            !model.visible;


          button
            .classList
            .toggle(

              "active",

              model.visible

            );


          button
            .querySelector(
              ".layer-state"
            )
            .textContent =

              model.visible
              ? "ON"
              : "OFF";

        }

      );

    }

  );



// =========================================
// RESIZE
// =========================================

window.addEventListener(

  "resize",

  function () {


    camera.aspect =

      window.innerWidth /

      window.innerHeight;


    camera.updateProjectionMatrix();


    renderer.setSize(

      window.innerWidth,

      window.innerHeight

    );

  }

);



// =========================================
// RENDER LOOP
// =========================================

function animate() {


  requestAnimationFrame(
    animate
  );


  controls.update();


  renderer.render(

    scene,

    camera

  );

}



// =========================================
// START
// =========================================

animate();


loadAnatomy();


</script>
