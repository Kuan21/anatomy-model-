<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>MJ Anatomy 3D</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #050607;
      color: white;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    #panel {
      position: fixed;
      top: 25px;
      left: 25px;
      z-index: 10;

      min-width: 280px;
      padding: 18px 22px;

      background: rgba(18, 20, 23, 0.82);
      border: 1px solid #34383e;
      border-radius: 16px;

      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    #panel h2 {
      margin: 0 0 6px 0;
      font-size: 22px;
    }

    #panel p {
      margin: 0;
      color: #9ba0a8;
      font-size: 14px;
    }

    #status {
      margin-top: 12px;
      color: #f0c36a;
      font-size: 12px;
    }

    #help {
      position: fixed;
      left: 50%;
      bottom: 25px;

      transform: translateX(-50%);

      z-index: 10;

      padding: 10px 16px;

      background: rgba(18, 20, 23, 0.82);
      border: 1px solid #34383e;
      border-radius: 20px;

      color: #aaa;
      font-size: 13px;

      white-space: nowrap;
    }
  </style>


  <!-- THREE.JS IMPORT MAP -->

  <script type="importmap">
  {
    "imports": {
      "three":
        "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",

      "three/addons/":
        "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>

</head>


<body>

  <!-- INFORMATION PANEL -->

  <div id="panel">

    <h2>
      MJ Anatomy 3D
    </h2>

    <p>
      Human Skeletal System
    </p>

    <div id="status">
      ● Loading skeleton...
    </div>

  </div>


  <!-- TOUCH HELP -->

  <div id="help">
    單指旋轉 · 雙指縮放 / 移動
  </div>



  <script type="module">

    // =====================================
    // IMPORTS
    // =====================================

    import * as THREE
    from "three";


    import {
      OrbitControls
    }
    from
    "three/addons/controls/OrbitControls.js";


    import {
      GLTFLoader
    }
    from
    "three/addons/loaders/GLTFLoader.js";


    import {
      DRACOLoader
    }
    from
    "three/addons/loaders/DRACOLoader.js";



    // =====================================
    // STATUS
    // =====================================

    const status =
      document.getElementById(
        "status"
      );



    // =====================================
    // SCENE
    // =====================================

    const scene =
      new THREE.Scene();


    scene.background =
      new THREE.Color(
        0x050607
      );



    // =====================================
    // CAMERA
    // =====================================

    const camera =
      new THREE.PerspectiveCamera(

        35,

        window.innerWidth /
        window.innerHeight,

        0.01,

        10000

      );


    camera.position.set(
      0,
      0,
      5
    );



    // =====================================
    // RENDERER
    // =====================================

    const renderer =
      new THREE.WebGLRenderer({

        antialias: true,

        powerPreference:
          "high-performance"

      });


    renderer.setSize(

      window.innerWidth,

      window.innerHeight

    );


    renderer.setPixelRatio(

      Math.min(
        window.devicePixelRatio,
        2
      )

    );


    renderer.outputColorSpace =
      THREE.SRGBColorSpace;


    document.body.appendChild(
      renderer.domElement
    );



    // =====================================
    // LIGHTING
    // =====================================

    const hemisphereLight =
      new THREE.HemisphereLight(

        0xffffff,

        0x202020,

        2.5

      );


    scene.add(
      hemisphereLight
    );



    const frontLight =
      new THREE.DirectionalLight(

        0xffffff,

        4

      );


    frontLight.position.set(
      4,
      6,
      8
    );


    scene.add(
      frontLight
    );



    const leftLight =
      new THREE.DirectionalLight(

        0xc7dcff,

        2

      );


    leftLight.position.set(
      -5,
      2,
      4
    );


    scene.add(
      leftLight
    );



    const rightLight =
      new THREE.DirectionalLight(

        0xffe8d0,

        1.5

      );


    rightLight.position.set(
      5,
      1,
      2
    );


    scene.add(
      rightLight
    );



    const backLight =
      new THREE.DirectionalLight(

        0xffffff,

        1.5

      );


    backLight.position.set(
      0,
      4,
      -5
    );


    scene.add(
      backLight
    );



    // =====================================
    // ORBIT CONTROLS
    // =====================================

    const controls =
      new OrbitControls(

        camera,

        renderer.domElement

      );


    controls.enableDamping =
      true;


    controls.dampingFactor =
      0.06;


    controls.enableRotate =
      true;


    controls.enableZoom =
      true;


    controls.enablePan =
      true;


    controls.minDistance =
      0.5;


    controls.maxDistance =
      20;



    // =====================================
    // DRACO DECODER
    // =====================================

    const dracoLoader =
      new DRACOLoader();


    dracoLoader.setDecoderPath(

      "https://www.gstatic.com/draco/v1/decoders/"

    );



    // =====================================
    // GLTF LOADER
    // =====================================

    const loader =
      new GLTFLoader();


    loader.setDRACOLoader(
      dracoLoader
    );



    // =====================================
    // LOAD HUMAN SKELETON
    // =====================================

    loader.load(

      "./models/skeleton.glb",



      // ===================================
      // SUCCESS
      // ===================================

      function (gltf) {

        const skeleton =
          gltf.scene;


        scene.add(
          skeleton
        );



        // ---------------------------------
        // Prepare meshes
        // ---------------------------------

        skeleton.traverse(

          function (object) {

            if (object.isMesh) {

              object.frustumCulled =
                true;


              if (object.material) {

                object.material.side =
                  THREE.FrontSide;


                object.material.needsUpdate =
                  true;

              }

            }

          }

        );



        // ---------------------------------
        // Calculate original bounding box
        // ---------------------------------

        const firstBox =
          new THREE.Box3()
          .setFromObject(
            skeleton
          );


        const originalCenter =
          new THREE.Vector3();


        firstBox.getCenter(
          originalCenter
        );



        // ---------------------------------
        // Center skeleton
        // ---------------------------------

        skeleton.position.x -=
          originalCenter.x;


        skeleton.position.y -=
          originalCenter.y;


        skeleton.position.z -=
          originalCenter.z;



        // ---------------------------------
        // Recalculate box after centering
        // ---------------------------------

        const box =
          new THREE.Box3()
          .setFromObject(
            skeleton
          );


        const size =
          new THREE.Vector3();


        box.getSize(
          size
        );



        const maxDimension =
          Math.max(

            size.x,

            size.y,

            size.z

          );



        // ---------------------------------
        // Calculate camera distance
        // ---------------------------------

        const verticalFOV =
          THREE.MathUtils.degToRad(
            camera.fov
          );


        const distanceForHeight =

          size.y /

          (
            2 *
            Math.tan(
              verticalFOV / 2
            )
          );



        const horizontalFOV =

          2 *

          Math.atan(

            Math.tan(
              verticalFOV / 2
            )

            *

            camera.aspect

          );



        const distanceForWidth =

          size.x /

          (
            2 *
            Math.tan(
              horizontalFOV / 2
            )
          );



        let cameraDistance =

          Math.max(

            distanceForHeight,

            distanceForWidth

          );


        cameraDistance *=
          1.2;



        // ---------------------------------
        // Camera position
        // ---------------------------------

        camera.position.set(

          0,

          0,

          cameraDistance

        );


        camera.near =
          Math.max(

            maxDimension /
            1000,

            0.001

          );


        camera.far =
          Math.max(

            maxDimension *
            100,

            cameraDistance *
            10

          );


        camera.updateProjectionMatrix();



        // ---------------------------------
        // Orbit controls
        // ---------------------------------

        controls.target.set(
          0,
          0,
          0
        );


        controls.minDistance =
          cameraDistance *
          0.1;


        controls.maxDistance =
          cameraDistance *
          6;


        controls.update();



        // ---------------------------------
        // Success message
        // ---------------------------------

        status.textContent =
          "● Skeleton loaded";


        status.style.color =
          "#7ee787";


        console.log(
          "Skeleton successfully loaded"
        );


        console.log(
          "Skeleton size:",
          size
        );


        console.log(
          "Skeleton:",
          skeleton
        );

      },



      // ===================================
      // LOADING PROGRESS
      // ===================================

      function (xhr) {

        if (
          xhr.total &&
          xhr.total > 0
        ) {

          const percent =
            Math.round(

              xhr.loaded /
              xhr.total *
              100

            );


          status.textContent =

            "● Loading skeleton " +

            percent +

            "%";

        }

      },



      // ===================================
      // ERROR
      // ===================================

      function (error) {

        console.error(
          "Skeleton loading error:",
          error
        );


        status.textContent =
          "● Failed to load skeleton";


        status.style.color =
          "#ff6b6b";

      }

    );



    // =====================================
    // WINDOW RESIZE
    // =====================================

    window.addEventListener(

      "resize",

      function () {

        camera.aspect =

          window.innerWidth /

          window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(

          window.innerWidth,

          window.innerHeight

        );

      }

    );



    // =====================================
    // ANIMATION LOOP
    // =====================================

    function animate() {

      requestAnimationFrame(
        animate
      );


      controls.update();


      renderer.render(

        scene,

        camera

      );

    }


    animate();

  </script>

</body>

</html>
